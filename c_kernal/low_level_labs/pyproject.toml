[project]
name = "low-level-labs"
version = "0.0.0"
description = "Python harness for low_level_labs — ctypes wrappers, pytest oracles, Jupyter notebooks"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "pytest>=7.4",
    "pyserial>=3.5",
    "pyperf>=2.6",
]

[project.optional-dependencies]
ebpf = [
    # bcc and bpfcc are typically distro packages (apt: bpfcc-tools, pacman: bcc-tools).
    # If installing via pip is required, see https://github.com/iovisor/bcc/blob/master/INSTALL.md
]
plotting = [
    "seaborn>=0.13",
    "pandas>=2.0",
]

[tool.pytest.ini_options]
testpaths = [
    "10_observability",
    "20_kernel_modules",
    "40_baremetal",
]
python_files = ["test_*.py"]
addopts = "-ra -q"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
